name: Unpack NinjaX
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and restructure
        run: |
          mkdir /tmp/n
          unzip -q "$(ls *.zip | head -1)" -d /tmp/n
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/n/. .
          git config user.name "unpack-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "NinjaX dengan struktur folder"
          git push
